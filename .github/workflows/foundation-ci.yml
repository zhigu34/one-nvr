name: Foundation CI
# Scope: keep the loop short. A workstation runs the same type/lint/unit checks
# in ~18s and the PostgreSQL suite in ~15min (deploy/production/verify.sh), so
# CI exists for what a workstation *cannot* do: Docker, a real ZLM, real
# segments and a real browser.
#
# Two jobs are conditional on what changed, so a frontend-only push does not
# pay for Go integration testing and a docs push barely runs at all:
#   backend   — Go, migrations, deploy scripts, integration tests
#   frontend  — the web app and the API contract
# Anything else (media, gateway, browser, production runtime, images) always
# runs, because it exercises the real containers a workstation cannot.
#
# Detection errs toward running: an unreadable base commit marks every group
# changed. Skipping a check must never be the reason a defect ships.
#
# Release validation can force everything with full_suite=true.
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Force every job regardless of which paths changed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Cheap gate: Compose rendering and shell syntax need no daemon, so a broken
  # Compose file or a typo'd script fails in a minute instead of minutes into a
  # media run. Also reports which path groups changed, for the two conditional
  # jobs below.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.changed.outputs.backend }}
      frontend: ${{ steps.changed.outputs.frontend }}
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The change detection below diffs against the previous tip, which
          # needs the history a shallow clone does not carry.
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed path groups
        id: changed
        run: |
          set -euo pipefail
          case '${{ github.event_name }}' in
            pull_request) base='${{ github.event.pull_request.base.sha }}' ;;
            push) base='${{ github.event.before }}' ;;
            *) base='' ;;
          esac
          head='${{ github.sha }}'
          # An initial push reports an all-zero "before", a force-push can
          # report a rewritten one, and a manual dispatch has none at all. Any
          # of those means "we cannot tell", which must run everything rather
          # than silently skipping a check.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base commit unavailable; treating every path group as changed"
            backend=yes; frontend=yes; code=yes
          else
            backend=no; frontend=no; code=no
            while IFS= read -r file; do
              case "$file" in
                # Documentation and handoff notes change no behaviour.
                docs/*|*.md) ;;
                # Go, the database, deployment and the acceptance harness.
                internal/*|cmd/*|migrations/*|go.mod|go.sum) backend=yes; code=yes ;;
                deploy/*|compose.yaml|deploy.sh|.github/*) backend=yes; frontend=yes; code=yes ;;
                # The web app and the contract its generated types come from.
                apps/web/*|docs/api/*) frontend=yes; code=yes ;;
                # End-to-end specs exercise both halves.
                tests/*) backend=yes; frontend=yes; code=yes ;;
                # Anything unrecognised is code: err toward running.
                *) code=yes ;;
              esac
            done < <(git diff --name-only "$base" "$head")
          fi
          printf 'backend=%s frontend=%s code=%s\n' "$backend" "$frontend" "$code"
          printf 'backend=%s\nfrontend=%s\ncode=%s\n' "$backend" "$frontend" "$code" >> "$GITHUB_OUTPUT"
      - name: Validate Compose and shell
        run: |
          docker compose -f deploy/production/compose.test.yaml config --quiet
          docker compose -f deploy/production/compose.e2e-test.yaml -f deploy/production/compose.media-e2e-test.yaml config --quiet
          docker compose -f deploy/production/compose.e2e-test.yaml -f deploy/production/compose.media-e2e-test.yaml -f deploy/production/compose.acceptance-test.yaml config --quiet
          bash -n deploy/production/test-media-e2e.sh deploy/production/joint-runtime.sh deploy/production/test-e2e.sh
          bash -n deploy.sh deploy/production/build-settings.sh deploy/production/test-deployment.sh deploy/production/test-compose-entry.sh deploy/production/dev.sh deploy/production/verify.sh
          ./deploy/production/test-compose-entry.sh
          python3 -m unittest discover -s deploy/production/tests -v
          sh -n deploy/production/web-tool.sh
  media-contract:
    needs: [validate]
    if: ${{ needs.validate.outputs.backend == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build media runtime with locked Debian packages
        id: media-build
        run: docker build -f deploy/production/Dockerfile.app --target media-test -t one-nvr/media-test:ci .
      - name: Fixed-image synthetic camera contract
        run: |
          ./deploy/production/test-media.sh --contract
          ./deploy/production/test-media.sh --probe
          ./deploy/production/test-media.sh --publish
          ./deploy/production/test-media.sh --switch
          ./deploy/production/test-media.sh --recovery
      - name: Fixed-image bulk import contract
        if: always() && steps.media-build.outcome == 'success'
        run: ./deploy/production/test-media.sh --import
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: media-contract
          path: media-test-results/*.json
  # Runs when Go, the schema, the deployment scripts or the acceptance harness
  # changed. This is the only automated net for migration and transactional
  # behaviour that a frontend-only change cannot break.
  backend:
    needs: [validate]
    if: ${{ needs.validate.outputs.backend == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    # Up to20m for the complete media/PG suite, plus locked tool build and unit/vet.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Go unit race tests
        run: |
          # CI logs are not readable without authentication, so a failure here
          # must publish its own diagnostics as an annotation. Without this the
          # only visible signal is "exit code 1".
          set +e
          out=$(./deploy/production/dev.sh test-go -race ./internal/... ./cmd/... ./migrations 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ $status -ne 0 ]; then
            summary=$(printf '%s' "$out" | grep -E "FAIL|--- FAIL|build failed|cannot|error:" | head -12 | tr "\n" "|")
            echo "::error title=Go unit race tests failed::${summary}"
          fi
          exit $status
      - name: PostgreSQL 17.11 integration race tests
        run: |
          set +e
          out=$(./deploy/production/dev.sh test-db -race -timeout 20m ./tests/integration 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ $status -ne 0 ]; then
            summary=$(printf '%s' "$out" | grep -E "FAIL|--- FAIL|build failed|cannot|error:" | head -12 | tr "\n" "|")
            echo "::error title=Integration race tests failed::${summary}"
          fi
          exit $status
      - name: Vet
        run: |
          set +e
          out=$(docker compose -p one-nvr-dev -f deploy/production/compose.test.yaml run --rm go go vet ./... 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ $status -ne 0 ]; then
            summary=$(printf '%s' "$out" | head -12 | tr "\n" "|")
            echo "::error title=go vet failed::${summary}"
          fi
          exit $status
      - name: Cleanup development containers
        if: always()
        run: docker compose -p one-nvr-dev -f deploy/production/compose.test.yaml down --volumes --remove-orphans
  # Runs when the web app or the API contract it generates types from changed.
  # Always cheap (~1 min), and it is the gate the browser/media jobs below hang
  # off, so a broken frontend fails fast instead of minutes into a media run.
  frontend:
    needs: [validate]
    if: ${{ needs.validate.outputs.frontend == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install frozen dependencies
        run: ./deploy/production/dev.sh web install --frozen-lockfile
      - name: Generate API types and check drift
        run: |
          ./deploy/production/dev.sh web api:generate
          git diff --exit-code -- apps/web/src/lib/api-types.ts
      - name: Build
        run: ./deploy/production/dev.sh web build
      - name: Lint
        run: ./deploy/production/dev.sh web lint
      - name: Cleanup development containers
        if: always()
        run: docker compose -p one-nvr-dev -f deploy/production/compose.test.yaml down --volumes --remove-orphans
  images:
    needs: [validate]
    if: ${{ needs.validate.outputs.backend == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [app, gateway]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned Linux amd64 image
        run: |
          # NAS checkouts may restrict other-user access while Git still sees +x.
          if [[ '${{ matrix.image }}' == gateway ]]; then chmod 700 deploy/production/gateway-entrypoint.sh; fi
          docker build --platform linux/amd64 --file "deploy/production/Dockerfile.${{ matrix.image }}" --tag "one-nvr/${{ matrix.image }}:ci" .
      - name: Gateway entry points usable by runtime UID after restrictive checkout
        if: matrix.image == 'gateway'
        run: |
          docker run --rm --network none --entrypoint sh one-nvr/gateway:ci -ec '
            test "$(id -u)" = 10001
            for entry in /usr/local/bin/gateway-entrypoint /usr/local/bin/gateway-control; do
              test -r "$entry"
              test -x "$entry"
              test "$(stat -c %a "$entry")" = 755
            done
          '
  gateway-runtime:
    needs: [validate]
    if: ${{ needs.validate.outputs.backend == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned app and gateway images
        run: |
          docker build --platform linux/amd64 -f deploy/production/Dockerfile.app -t one-nvr/app:ci .
          docker build --platform linux/amd64 -f deploy/production/Dockerfile.gateway -t one-nvr/gateway:ci .
      - name: Actual Nginx application, rollback and crash recovery
        run: ./deploy/production/test-gateway.sh
  browser-runtime:
    needs: [validate]
    if: ${{ needs.validate.outputs.code == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned runtime and browser images
        run: |
          for image in app gateway browser; do
            ./deploy/production/ci-run.sh "browser image $image" docker build -f "deploy/production/Dockerfile.$image" -t "one-nvr/$image:ci" . || exit 1
          done
      - name: Frontend browser unit tests
        run: ./deploy/production/ci-run.sh "frontend browser unit tests" docker run --rm --init --shm-size=256m one-nvr/browser:ci pnpm test
      - name: Real browser with modules disabled and manual certificate
        run: ./deploy/production/ci-run.sh "E2E modules disabled" ./deploy/production/dev.sh e2e --no-build
      - name: Real browser with modules enabled
        run: ./deploy/production/ci-run.sh "E2E modules enabled" env ONE_NVR_E2E_MODULES=yes ./deploy/production/dev.sh e2e --no-build
      - name: Real browser with read-only certificate directory
        run: ./deploy/production/ci-run.sh "E2E read-only TLS dir" env ONE_NVR_E2E_TLS_DIR=/tls-input ./deploy/production/dev.sh e2e --no-build
  media-browser-runtime:
    needs: [validate]
    if: ${{ needs.validate.outputs.code == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned production media and browser images
        run: |
          for image in app gateway browser; do docker build -f "deploy/production/Dockerfile.$image" -t "one-nvr/$image:ci" .; done
          docker build -f deploy/production/Dockerfile.app --target media-test -t one-nvr/media-test:ci .
      - name: Actual UI source switches, rollback and recording controls
        run: ./deploy/production/test-media-e2e.sh --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: media-browser-contract
          path: media-test-results/media-browser.json
  joint-media-runtime:
    needs: [validate]
    if: ${{ needs.validate.outputs.backend == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned production and acceptance images
        run: |
          for image in app gateway browser; do docker build -f "deploy/production/Dockerfile.$image" -t "one-nvr/$image:ci" .; done
          docker build -f deploy/production/Dockerfile.app --target media-test -t one-nvr/media-test:ci .
          docker build -f deploy/production/Dockerfile.fixture-runner -t one-nvr/fixture-runner:ci .
      - name: Actual two-channel process, database, certificate and publication faults
        run: ./deploy/production/test-media-e2e.sh --acceptance --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: joint-media-contract
          path: media-test-results/*.json
  production-runtime:
    needs: [validate]
    if: ${{ needs.validate.outputs.backend == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build actual production images
        run: |
          docker build -f deploy/production/Dockerfile.app -t one-nvr/app:m1a .
          docker build -f deploy/production/Dockerfile.gateway -t one-nvr/gateway:m1a .
      - name: Actual production core and repeat deployment
        run: ./deploy/production/ci-run.sh "Production core and repeat deployment" ./deploy/production/test-deployment.sh
      - name: Actual Mosquitto password conversion remains idempotent
        run: |
          image=eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
          docker run --rm --network none --user 0:0 --tmpfs /work --mount "type=bind,source=$PWD/deploy/production/hash-mqtt.sh,target=/hash-mqtt.sh,readonly" --entrypoint sh "$image" -ec 'printf "one_nvr:isolated-test-only\n" > /work/passwords; sh /hash-mqtt.sh /work/passwords; before=$(sha256sum /work/passwords); sh /hash-mqtt.sh /work/passwords; after=$(sha256sum /work/passwords); test "$before" = "$after"; printf "Mosquitto actual repeated hash conversion PASS\n"'
      - name: Actual Mosquitto conversion reports no ownership warning
        run: |
          # Mosquitto 2.0.16+ warns when a sensitive file is world readable or
          # owned by a user other than the reader. The deployed layout hits the
          # ownership case: init-runtime creates the broker password file as
          # 1883:1883 while the conversion step runs as root, so deploy.sh hands
          # the file to root before converting and back to 1883 afterwards.
          #
          # The measurements are printed as one annotation because job logs are
          # not readable without authentication; the assertions below are built
          # from what this step actually observed (identity=0:0, mode -rw-------,
          # both stages), not from assumptions about the tools available.
          image=eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
          report=$(docker run --rm --network none --user 0:0 --tmpfs /work --mount "type=bind,source=$PWD/deploy/production/hash-mqtt.sh,target=/hash-mqtt.sh,readonly" --entrypoint sh "$image" -ec '
            set -u
            printf "identity=%s:%s\n" "$(id -u)" "$(id -g)"

            echo "--- stage 1: broker-owned file read by root (the hazard) ---"
            printf "one_nvr:isolated-test-only\n" > /work/passwords1
            chmod 600 /work/passwords1
            chown 1883:1883 /work/passwords1
            printf "stage1_before=%s\n" "$(ls -ln /work/passwords1 | tr -s " " | cut -d" " -f1,3,4)"
            printf "stage1_warned=%s\n" "$(sh /hash-mqtt.sh /work/passwords1 2>&1 >/dev/null | tr "\n" ";")"
            printf "stage1_after=%s\n" "$(ls -ln /work/passwords1 | tr -s " " | cut -d" " -f1,3,4)"

            echo "--- stage 2: handoff first, then convert (expected silent) ---"
            printf "one_nvr:isolated-test-only\n" > /work/passwords2
            chmod 600 /work/passwords2
            chown 0:0 /work/passwords2
            printf "stage2_before=%s\n" "$(ls -ln /work/passwords2 | tr -s " " | cut -d" " -f1,3,4)"
            printf "stage2_warned=%s\n" "$(sh /hash-mqtt.sh /work/passwords2 2>&1 >/dev/null | tr "\n" ";")"
            chown 1883:1883 /work/passwords2
            printf "stage2_after=%s\n" "$(ls -ln /work/passwords2 | tr -s " " | cut -d" " -f1,3,4)"
          ' 2>&1) || true
          flat=$(printf "%s" "$report" | tr "\n" "|" | sed "s/|/ | /g")

          fail=0
          # Assertions read the flattened form, the same text the annotation
          # carries. Comparing the raw report here would silently never match a
          # line boundary and fail a correct product.
          # The hazard must be real: a broker-owned file read by root warns.
          case "$flat" in
            *"owner is not root"*) ;;
            *) echo "stage 1 produced no ownership warning; the hazard this guards against is not being exercised" >&2; fail=1 ;;
          esac
          # The handoff must fix it: silent conversion from a root-owned file.
          case "$flat" in
            *"stage2_warned= |"*|*"stage2_warned=| "*) ;;
            *) echo "stage 2 was not silent: $(printf "%s" "$flat" | tr "|" "\n" | grep stage2_warned)" >&2; fail=1 ;;
          esac
          # ...and the file must end up owned by the broker user again.
          case "$flat" in
            *"stage2_after=-rw------- 1883 1883"*) ;;
            *) echo "stage 2 did not end broker-owned: $(printf "%s" "$flat" | tr "|" "\n" | grep stage2_after)" >&2; fail=1 ;;
          esac
          if [ "$fail" = "1" ]; then
            # Emitted only on failure: an unconditional ::error fails the step
            # on its own, so a passing check would report red forever.
            echo "::error title=Mosquitto ownership failure::${flat}"
            exit 1
          fi
          # A warning carries the measurements into the UI without failing the
          # step; job logs need authentication, this annotation does not.
          echo "::warning title=Mosquitto ownership measurements::${flat}"
          printf 'Mosquitto conversion ownership PASS\n'
      - name: Actual Frigate config seed belongs to the publishing user
        run: |
          # The detection publisher rewrites config.yml on every publication and
          # runs as the application user (10001). The deploy-time seed must be
          # handed to that user, otherwise every publication fails with an
          # unhelpful "publish failed" while the seeded file sits at root:0600
          # — the exact shape of the reported field failure. render-deployment
          # is the writer (init-runtime only creates the directories), and the
          # non-check path is the one that reaches it.
          #
          # Every observation is printed as one annotation because job logs are
          # not readable without authentication: a bare "exit code 1" is not
          # actionable, and this step stayed opaque for several rounds precisely
          # because it published nothing.
          root=$(mktemp -d /tmp/one-nvr-frigate-owner.XXXXXX)
          # The seed is chowned to the application user (10001) at mode 0700,
          # which is exactly what this check asserts — and also what the runner
          # user cannot delete. A plain `trap 'rm -rf "$root"' EXIT` therefore
          # fails after a fully successful check and reports the step red: the
          # failure looks identical to a real assertion failure while every
          # measurement is correct. Cleanup is best-effort and must never decide
          # the step's verdict; the runner tears the machine down anyway.
          trap 'docker run --rm --network none --user 0:0 --mount "type=bind,source=$root,target=/fixture" --entrypoint sh one-nvr/app:m1a -ec "rm -rf /fixture/data /fixture/storage" >/dev/null 2>&1 || rm -rf "$root" 2>/dev/null || true' EXIT
          mkdir "$root/storage"
          chmod 755 "$root" "$root/storage"
          mkdir -p "$root/data"
          # printf rather than a heredoc: a YAML block scalar ends at the first
          # line dedented past it, so a column-zero heredoc terminator inside
          # `run: |` breaks the workflow file itself, and an indented one is a
          # shell syntax error.
          printf '%s\n' \
            'ONE_NVR_PUBLIC_URL=https://127.0.0.1:19443' \
            'ONE_NVR_HTTPS_PORT=19443' \
            'ONE_NVR_RTC_PORT=19000' \
            "ONE_NVR_DATA_DIR=$root/data" \
            "ONE_NVR_STORAGE_ROOT=$root/storage" \
            'ONE_NVR_FRIGATE_ENABLE=yes' \
            'ONE_NVR_OPENLIST_ENABLE=no' > "$root/env"
          report=""
          record() { report="$report | $1"; }
          init_status=0
          init_out=$(docker run --rm --network none --user 0:0 --mount "type=bind,source=$root/data,target=/data" --entrypoint /usr/local/bin/admin one-nvr/app:m1a init-runtime 2>&1) || init_status=$?
          record "init_status=$init_status"
          record "init_out=$(printf '%s' "$init_out" | tr '\n' ';')"
          render_status=0
          render_out=$(docker run --rm --network none --user 0:0 --mount "type=bind,source=$root/data,target=/data" --mount "type=bind,source=$root/env,target=/settings.env,readonly" --entrypoint /usr/local/bin/admin one-nvr/app:m1a render-deployment --env-file /settings.env --output-dir /data/runtime 2>&1) || render_status=$?
          record "render_status=$render_status"
          record "render_out=$(printf '%s' "$render_out" | tr '\n' ';' | cut -c1-400)"
          record "tree=$(docker run --rm --network none --user 0:0 --mount "type=bind,source=$root/data,target=/data" --entrypoint sh one-nvr/app:m1a -ec 'ls -ln /data/frigate/ 2>&1 | tr "\n" ";"' || true)"
          ownership=$(docker run --rm --network none --user 0:0 --mount "type=bind,source=$root/data,target=/data" --entrypoint stat one-nvr/app:m1a -c "%u:%g %a" /data/frigate/config.yml 2>&1) || true
          record "config_ownership=$ownership"
          dir_ownership=$(docker run --rm --network none --user 0:0 --mount "type=bind,source=$root/data,target=/data" --entrypoint stat one-nvr/app:m1a -c "%u:%g" /data/frigate 2>&1) || true
          record "dir_ownership=$dir_ownership"

          fail=0
          # init-runtime must succeed, otherwise there is no seed to judge and
          # the ownership below would be measuring an empty directory.
          [ "$init_status" = "0" ] || { echo "init-runtime failed: $init_out" >&2; fail=1; }
          [ "$render_status" = "0" ] || { echo "render-deployment failed: $render_out" >&2; fail=1; }
          # The seed belongs to the publishing user, and only to it.
          [ "$ownership" = "10001:10001 600" ] || { echo "config.yml seed ownership is $ownership, expected 10001:10001 600" >&2; fail=1; }
          # And the directory it lives in must stay writable by that user.
          [ "$dir_ownership" = "10001:10001" ] || { echo "frigate dir ownership is $dir_ownership, expected 10001:10001" >&2; fail=1; }
          if [ "$fail" = "1" ]; then
            # Emitted only on failure: an unconditional ::error makes the step
            # fail on its own, which is what kept this check red for rounds
            # while every measurement it printed was correct.
            echo "::error title=Frigate seed ownership failure::${report}"
            exit 1
          fi
          # A warning carries the measurements into the UI without failing the
          # step; job logs need authentication, this annotation does not.
          echo "::warning title=Frigate seed ownership measurements::${report}"
          printf 'Frigate config seed ownership PASS\n'

  hardware-cpu-runtime:
    needs: [validate]
    if: ${{ needs.validate.outputs.backend == 'yes' || inputs.full_suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Real fixed-image decoding and model inference
        run: |
          image=ghcr.io/blakeblackshear/frigate:0.17.2@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 128 --mount "type=bind,source=$PWD/deploy/production/hardware-probe.py,target=/probe.py,readonly" --entrypoint python3 "$image" /probe.py cpu none > /tmp/hardware-result.json
          docker run --rm -i --network none --entrypoint python3 "$image" -c 'import json,sys; r=json.load(sys.stdin); assert r["decode"] and r["inference"]; assert len(r["sample_sha256"])==64 and len(r["model_sha256"])==64; print("CPU actual decoder and inference PASS; no camera capacity claim")' < /tmp/hardware-result.json
