name: one-nvr-m0

x-frigate: &frigate
  image: ghcr.io/blakeblackshear/frigate:0.17.2@sha256:d4351369984d4a9e2a49ac59736f6490856a7ea11f7790040746d21496967010
  restart: unless-stopped
  shm_size: "${M0_SHM_SIZE:-256mb}"
  depends_on: [mqtt, zlm]
  environment: {TZ: UTC}
  volumes:
    - ${M0_STATE_DIR:-./state}/frigate:/config
    - ${M0_STATE_DIR:-./state}/frigate-media:/media/frigate
  tmpfs:
    - /tmp/cache:size=134217728
  networks:
    control:
      aliases: [frigate]

services:
  # Runs automatically before services consuming generated files start.
  init:
    image: one-nvr-m0-tools:local
    pull_policy: never
    build:
      context: .
      pull: false
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple}
    working_dir: /workspace
    env_file: .env
    environment:
      COMPOSE_PROFILES: "${COMPOSE_PROFILES:?请在 .env 填写 COMPOSE_PROFILES=cpu 或 intel}"
      M0_MEDIA_HOST: "${M0_MEDIA_HOST:?请在 .env 填写 M0_MEDIA_HOST 服务器 IP}"
      M0_RTC_PORT: "${M0_RTC_PORT:-8000}"
    entrypoint: ["python", "/app/bootstrap.py", "--directory", "/workspace", "--storage-root", "/storage", "--no-env", "--from-env"]
    command: []
    network_mode: none
    volumes:
      - ${M0_STATE_DIR:-./state}:/workspace/state
      - ${M0_STORAGE_ROOT:-./storage}:/storage

  mqtt-init:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    depends_on:
      init: {condition: service_completed_successfully}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'mosquitto_passwd -b -c /work/passwords m0 "$$(cat /run/secrets/mqtt_password)"; chmod 644 /work/passwords; chown -R 1883:1883 /mqtt-data'
    volumes:
      - ${M0_STATE_DIR:-./state}/secrets:/run/secrets:ro
      - ${M0_STATE_DIR:-./state}/mqtt-auth:/work
      - ${M0_STATE_DIR:-./state}/mqtt-data:/mqtt-data
    networks: [control]

  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    restart: unless-stopped
    depends_on:
      mqtt-init: {condition: service_completed_successfully}
    command: ["mosquitto", "-c", "/m0/mosquitto.conf"]
    volumes:
      - ${M0_STATE_DIR:-./state}:/m0:ro
      - ${M0_STATE_DIR:-./state}/mqtt-auth:/mosquitto/auth:ro
      - ${M0_STATE_DIR:-./state}/mqtt-data:/mosquitto/data
    networks: [control]

  zlm:
    image: zlmediakit/zlmediakit:master@sha256:25ecf6c4a55e72bc495be15c8480f0b0cef58c712e5c9f0596452777b41bf344
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
    environment: {TZ: UTC}
    command: ["./MediaServer", "-s", "default.pem", "-c", "/m0/zlm.ini", "-l", "0"]
    volumes:
      - ${M0_STATE_DIR:-./state}:/m0:ro
      - ${M0_STORAGE_ROOT:-./storage}:/storage
    ports:
      - "${M0_RTC_PORT:-8000}:${M0_RTC_PORT:-8000}/udp"
      - "${M0_RTC_PORT:-8000}:${M0_RTC_PORT:-8000}/tcp"
    networks: [control]

  frigate:
    <<: *frigate
    profiles: [cpu]

  frigate-intel:
    <<: *frigate
    profiles: [intel]
    devices:
      - ${M0_GPU_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128
    environment: {TZ: UTC, LIBVA_DRIVER_NAME: iHD}

  probe:
    image: one-nvr-m0-tools:local
    pull_policy: never
    restart: unless-stopped
    depends_on: [mqtt, zlm]
    environment: {TZ: UTC, PYTHONUNBUFFERED: "1"}
    volumes:
      - ${M0_STATE_DIR:-./state}/probe:/state
      - ${M0_STORAGE_ROOT:-./storage}:/storage:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [control]

  gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    restart: unless-stopped
    depends_on:
      probe: {condition: service_healthy}
    command: ["nginx", "-c", "/m0/nginx.conf", "-g", "daemon off;"]
    ports:
      - "${M0_HTTPS_PORT:-8443}:443"
    volumes:
      - ${M0_STATE_DIR:-./state}:/m0:ro
      - ${M0_STATE_DIR:-./state}/web:/usr/share/nginx/html:ro
      - ${M0_STORAGE_ROOT:-./storage}:/storage:ro
    networks: [control]

networks:
  # Bridge network allows camera access. No upstream management TCP ports are published.
  control: {driver: bridge}
