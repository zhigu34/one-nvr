# Temporary CI-only synthetic camera fixture. No production .env/data/ports.
services:
  camera:
    image: zlmediakit/zlmediakit:master@sha256:25ecf6c4a55e72bc495be15c8480f0b0cef58c712e5c9f0596452777b41bf344
    platform: linux/amd64
    command: ["./MediaServer", "-c", "/opt/media/conf/config.ini", "-l", "0"]
    volumes:
      - ${ONE_NVR_MEDIA_TEST_DIR:?isolated test directory}/camera.ini:/opt/media/conf/config.ini:ro
  zlm:
    image: zlmediakit/zlmediakit:master@sha256:25ecf6c4a55e72bc495be15c8480f0b0cef58c712e5c9f0596452777b41bf344
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/media-launcher"]
    command: ["/opt/media/conf/egress.json", "./MediaServer", "-c", "/opt/media/conf/config.ini", "-l", "${ONE_NVR_MEDIA_TEST_LOG_LEVEL:-0}", "--log-dir", "/tmp/one-nvr-media-log"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    cap_add: [NET_ADMIN]
    environment:
      TZ: UTC
    volumes:
      - ${ONE_NVR_MEDIA_TEST_DIR}/zlm.ini:/opt/media/conf/config.ini:ro
      - ${ONE_NVR_MEDIA_TEST_DIR}/launcher:/usr/local/bin/media-launcher:ro
      - ${ONE_NVR_MEDIA_TEST_DIR}/egress.json:/opt/media/conf/egress.json:ro
      - ${ONE_NVR_MEDIA_TEST_DIR}/storage:/storage
  fixture:
    image: one-nvr/media-test:ci
    entrypoint: ["/usr/local/bin/media-test", "fixture"]
    depends_on: [camera]
  runner:
    image: one-nvr/media-test:ci
    user: "10001:10001"
    entrypoint: ["/usr/local/bin/media-test", "${ONE_NVR_MEDIA_TEST_MODE:-contract}"]
    volumes:
      - ${ONE_NVR_MEDIA_TEST_DIR}/storage:/storage
      - ${ONE_NVR_MEDIA_TEST_DIR}/evidence:/evidence

  postgres:
    profiles: [probe]
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    platform: linux/amd64
    environment:
      POSTGRES_USER: one_nvr_media
      POSTGRES_DB: one_nvr_media
      POSTGRES_PASSWORD: isolated-media-database
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U one_nvr_media -d one_nvr_media"]
      interval: 1s
      timeout: 3s
      retries: 30
