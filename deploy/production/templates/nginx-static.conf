# Development foundation only; production TLS/control/proxy lands in Task 7.
server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 location = /health { access_log off; default_type application/json; return 200 '{"status":"alive"}'; }
 location ^~ /api/ { return 503; }
 location / { try_files $uri $uri/ /index.html; }
 location ~ /\. { deny all; }
}
