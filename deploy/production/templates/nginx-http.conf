worker_processes auto;
pid /control/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  client_body_temp_path /control/tmp/client;
  proxy_temp_path /control/tmp/proxy;
  fastcgi_temp_path /control/tmp/fastcgi;
  uwsgi_temp_path /control/tmp/uwsgi;
  scgi_temp_path /control/tmp/scgi;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  # Re-resolve the private API after Docker recreates it at another address.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    client_max_body_size 2m;
    location = /health { default_type application/json; return 200 '{"status":"alive"}'; }
    location /api/ {
      set $one_nvr_api http://api:8081;
      proxy_pass $one_nvr_api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-One-NVR-Client-IP $remote_addr;
      proxy_set_header X-One-NVR-Proxy-Token __PROXY_TOKEN__;
      proxy_read_timeout 20s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
