worker_processes auto;
pid /control/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  client_body_temp_path /control/tmp/client;
  proxy_temp_path /control/tmp/proxy;
  fastcgi_temp_path /control/tmp/fastcgi;
  uwsgi_temp_path /control/tmp/uwsgi;
  scgi_temp_path /control/tmp/scgi;
  access_log off;
  server {
    listen 80;
    server_name _;
    location = /health { default_type application/json; return 200 '{"status":"alive"}'; }
    location / { return 503; }
  }
}
