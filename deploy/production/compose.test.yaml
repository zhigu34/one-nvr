# Isolated development tooling. No production data, ports or .env are loaded.
services:
  go:
    image: one-nvr/go-test:dev
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go-test
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    # No depends_on on mqtt: the event tests detect the broker themselves and
    # skip when it is absent, so a broker that fails to start must not take the
    # whole Go suite down with it. The broker is a test asset, not a
    # prerequisite for compiling or running the other packages.
    environment:
      GOPROXY: ${ONE_NVR_GOPROXY:-https://proxy.golang.org,direct}
      ONE_NVR_REQUIRE_MEDIA_TOOLS: "yes"
      # Points the event tests at the real broker in this file.
      ONE_NVR_TEST_MQTT: mqtt:1883
      ONE_NVR_TEST_MQTT_USER: one_nvr
      ONE_NVR_TEST_MQTT_PASSWORD: isolated-test-only
  web:
    image: node:24.21.0-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    platform: linux/amd64
    working_dir: /workspace/apps/web
    entrypoint: ["/workspace/deploy/production/web-tool.sh"]
    volumes:
      - ../..:/workspace
      - web-deps:/workspace/apps/web/node_modules
      - web-tools:/tools
      - web-store:/pnpm/store
    environment:
      ONE_NVR_NPM_REGISTRY: ${ONE_NVR_NPM_REGISTRY:-https://registry.npmjs.org}
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    platform: linux/amd64
    environment:
      POSTGRES_USER: one_nvr_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: one_nvr_test
    volumes:
      - test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one_nvr_test -d one_nvr_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  # A real broker for the event-ingestion tests. A fake broker answers whatever
  # the client sends, so it cannot catch a malformed frame; only the real
  # protocol stack rejects one (a missing UTF-8 length prefix once reached
  # production that way).
  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    platform: linux/amd64
    entrypoint: ["sh", "-ec"]
    command:
      - |
        printf 'listener 1883\nallow_anonymous false\npassword_file /mosquitto/config/passwords\nlog_dest stdout\n' > /mosquitto/config/mosquitto.conf
        # Idempotent: mosquitto_passwd -c refuses to overwrite an existing
        # file, so a recreated container would exit before the broker starts
        # and every dependent step would stall waiting for it.
        if [ ! -f /mosquitto/config/passwords ]; then
          mosquitto_passwd -c -b /mosquitto/config/passwords one_nvr isolated-test-only
        fi
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      # Publishes rather than subscribes: mosquitto_sub's -C 1 would wait for a
      # message that never comes and the health check would always time out.
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -u one_nvr -P isolated-test-only -t health -m ok"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  go-mod:
  go-build:
  web-deps:
  web-tools:
  web-store:
  test-db:
