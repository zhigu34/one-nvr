# Transient CI fixture only. No production .env, ports, storage or Docker socket.
x-app-env: &app-env
  ONE_NVR_PUBLIC_URL: http://gateway
  ONE_NVR_DATA_DIR: /data
  ONE_NVR_HTTP_PORT: "80"
  ONE_NVR_MEDIA_HOST: 127.0.0.1
  ONE_NVR_TLS_DIR: "${ONE_NVR_E2E_TLS_DIR:-}"
  ONE_NVR_DATABASE_URL: postgres://one_nvr_test:isolated-test-only@postgres:5432/one_nvr_test?sslmode=disable
  ONE_NVR_FRIGATE_ENABLE: "${ONE_NVR_E2E_MODULES:-no}"
  ONE_NVR_OPENLIST_ENABLE: "${ONE_NVR_E2E_MODULES:-no}"
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: one_nvr_test
      POSTGRES_PASSWORD: isolated-test-only
      POSTGRES_DB: one_nvr_test
    volumes: [runtime-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U one_nvr_test -d one_nvr_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  permissions:
    image: one-nvr/app:ci
    user: "0:0"
    entrypoint: [sh, -ec]
    command:
      - |
        mkdir -p /storage/pool1
        chmod 755 /storage /storage/pool1
        chown 10001:10001 /storage/pool1
        mkdir -p /data/secrets /data/test-phase /data/tls/versions /data/gateway /cache/go /cache/build /tls-input /data/e2e
        chmod 700 /tls-input /data/e2e /data /data/secrets /data/test-phase /data/tls /data/tls/versions /data/gateway
        chown 10001:10001 /tls-input /data/e2e /data /data/secrets /data/test-phase /data/tls /data/tls/versions /data/gateway /cache /cache/go /cache/build
    volumes:
      - runtime-data:/data
      - runtime-tls:/data/tls
      - runtime-control:/data/gateway
      - runtime-cache:/cache
      - runtime-input:/tls-input
      - runtime-storage:/storage
  runner:
    image: golang:1.27.1-bookworm@sha256:69a7b9788769bec032d238959b61854e9ae87f57be9029ec04e9885fabf99195
    user: "10001:10001"
    working_dir: /workspace
    environment:
      <<: *app-env
      ONE_NVR_GATEWAY_RUNTIME: isolated
      GOPATH: /cache/go
      GOCACHE: /cache/build
      CGO_ENABLED: "0"
    volumes:
      - ../..:/workspace:ro
      - runtime-data:/data
      - runtime-tls:/data/tls
      - runtime-control:/data/gateway
      - runtime-cache:/cache
      - runtime-input:/tls-input
  api:
    image: one-nvr/app:ci
    environment:
      <<: *app-env
      ONE_NVR_LISTEN_ADDRESS: :8081
    volumes:
      - runtime-data:/data
      - runtime-tls:/data/tls
      - runtime-control:/data/gateway
      - runtime-input:/tls-input:ro
      - runtime-storage:/storage
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    image: one-nvr/app:ci
    entrypoint: [/usr/local/bin/worker]
    environment:
      <<: *app-env
      ONE_NVR_LISTEN_ADDRESS: :8082
    volumes:
      - runtime-data:/data
      - runtime-tls:/data/tls
      - runtime-control:/data/gateway
      - runtime-input:/tls-input:ro
      - runtime-storage:/storage
    depends_on:
      postgres: {condition: service_healthy}
  gateway:
    image: one-nvr/gateway:ci
    environment:
      ONE_NVR_PUBLIC_URL: http://gateway
    # Only a fixed, private generated credential is read; no user .env is sourced.
    entrypoint: [sh, -ec]
    command: ['export ONE_NVR_GATEWAY_PROXY_TOKEN="$$(cat /control/proxy-token)"; exec /usr/local/bin/gateway-entrypoint']
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    volumes:
      - runtime-control:/control
      - runtime-tls:/certs:ro
    depends_on: [api]
  browser:
    image: one-nvr/browser:ci
    init: true
    user: "10001:10001"
    shm_size: 256mb
    environment:
      ONE_NVR_E2E_POOL: "yes"
      ONE_NVR_E2E_URL: http://gateway
      ONE_NVR_E2E_SECRETS_FILE: /data/secrets/one-nvr.json
      ONE_NVR_E2E_CERT: /data/e2e/fullchain.pem
      ONE_NVR_E2E_KEY: /data/e2e/privkey.pem
      ONE_NVR_E2E_MODULES: "${ONE_NVR_E2E_MODULES:-no}"
      ONE_NVR_E2E_TLS_DIR: "${ONE_NVR_E2E_TLS_DIR:-}"
    volumes:
      - runtime-data:/data:ro
volumes:
  runtime-storage:
  runtime-input:
  runtime-db:
  runtime-data:
  runtime-tls:
  runtime-control:
  runtime-cache:
