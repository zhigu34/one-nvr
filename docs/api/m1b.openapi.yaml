            "type": "object",
            "nullable": true,
            "description": "Outcome of the last explicit test delivery: {state, status?, error?, checked_at}."
          },
          "version": { "type": "integer" },
          "created_at": { "type": "string", "format": "date-time" }
        }
      },
      "NotificationChannelList": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/NotificationChannel" }
          },
          "kinds": {
            "type": "array",
            "items": { "type": "string" },
            "description": "The channel kinds this build can deliver, read from the adapter registry. A build that ships a new adapter reports it here, so the UI never offers a kind without one."
          }
        }
      },
      "NotificationDelivery": {
        "type": "object",
        "properties": {
          "channel_id": { "$ref": "m1a.openapi.yaml#/components/schemas/UUID" },
          "channel_name": { "type": "string" },
          "channel_kind": { "type": "string" },
          "notification_id": { "$ref": "m1a.openapi.yaml#/components/schemas/UUID" },
          "state": {
            "type": "string",
            "enum": ["sending", "failed", "retrying", "succeeded", "exhausted"],
            "description": "sending: queued or being attempted. failed: this attempt failed and a retry is coming. retrying: failed at least once and still within budget. succeeded: the receiver answered 2xx. exhausted: out of attempts, or permanently refused."
          },
          "error": { "type": "string", "description": "What the receiver said, or the transport reason. Never carries the signing secret." },
          "http_status": { "type": "integer", "nullable": true },
          "delivered_at": { "type": "string", "format": "date-time", "nullable": true },
          "updated_at": { "type": "string", "format": "date-time" },
          "title": { "type": "string", "description": "From the frozen message, so it agrees with the inbox after the rule or channel was later edited." },
          "severity": { "type": "string", "enum": ["low", "medium", "high"] }
        }
      },
      "NotificationDeliveryPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/NotificationDelivery" }
          }
        }
      },
      "RuleChannelBinding": {
        "type": "object",
        "properties": {
          "channel_ids": {
            "type": "array",
            "items": { "$ref": "m1a.openapi.yaml#/components/schemas/UUID" },
            "description": "An empty list is legitimate: the rule still records its hits, it just tells no one."
          }
        }
      },
      "RecordingSegment": {
        "type": "object",
        "properties": {
          "archived": {
            "type": "boolean",
            "description": "A verified cloud copy exists in the archive index (M2.1)."
          },
          "id": {
            "$ref": "m1a.openapi.yaml#/components/schemas/UUID"
          },
          "channel_id": {
            "$ref": "m1a.openapi.yaml#/components/schemas/UUID"
          },
          "source_revision_id": {
            "$ref": "m1a.openapi.yaml#/components/schemas/UUID"
          },
          "pool_id": {
            "$ref": "m1a.openapi.yaml#/components/schemas/UUID"
          },
          "run_id": {
            "$ref": "m1a.openapi.yaml#/components/schemas/UUID"
          },
          "start": {
            "type": "string",
            "format": "date-time"
          },
          "end": {
            "type": "string",
            "format": "date-time"
          },
          "bytes": {
            "type": "integer",
            "minimum": 1
          },
          "state": {
            "type": "string",
            "enum": [
              "finalizing",
              "ready",
              "missing",
              "damaged",
              "conflict",
              "provisional",
              "deleted"
            ],
            "description": "deleted means the local copy was removed deliberately (manual removal or retention); missing means the file disappeared outside one-nvr. The two are never merged."
          },
          "naming_timezone": {
            "type": "string"
          },
          "utc_offset_seconds": {
            "type": "integer"
          },
          "check_state": {
            "type": "string"
          },
          "protected": {
            "type": "boolean",
            "description": "Evidence protection. Retention and manual deletion both skip a protected recording until it is released."
          },
          "media": {
            "$ref": "#/components/schemas/RecordingMediaParams"
          }
        },
        "required": [
          "id",
          "channel_id",
          "source_revision_id",
          "pool_id",
          "run_id",
          "start",
          "end",
          "bytes",
          "state",
          "naming_timezone",
          "utc_offset_seconds",
          "check_state",
          "protected",
          "media"
        ],
        "additionalProperties": false
      },
      "RecordingMediaParams": {
        "type": "object",
        "description": "Media facts restated from the verification evidence captured when the recording was published. Zero values mean that evidence predates the capture, not that the property is absent.",
        "properties": {
          "codec": {
            "type": "string"
          },
          "width": {
            "type": "integer"
          },
          "height": {
            "type": "integer"
          },
          "fps": {
            "type": "number"
          },
          "duration_ms": {
            "type": "integer"
          }
        },
        "required": [
          "codec",
          "width",
          "height",
          "fps",
          "duration_ms"
        ],
        "additionalProperties": false
      },
      "RecordingStats": {
        "type": "object",
        "description": "Totals for the same filter window as the list, so the management view can state the scope of a selection before deleting it. logical_bytes describes media the index still holds; deleted_bytes is what deliberate deletion already reclaimed. They are reported separately and never summed.",
        "properties": {
          "segments": {
            "type": "integer",
            "minimum": 0
          },
          "ready": {
            "type": "integer",
            "minimum": 0
          },
          "anomalous": {
            "type": "integer",
            "minimum": 0
          },
          "protected": {
            "type": "integer",
            "minimum": 0
          },
          "cloud_only": {
            "type": "integer",
            "description": "Segments whose local copy is deleted but a verified cloud copy exists: still playable."
          },
          "deleted": {
            "type": "integer",
            "minimum": 0
          },
          "duration_ms": {
            "type": "integer",
            "minimum": 0
          },
          "logical_bytes": {
            "type": "integer",
            "minimum": 0
          },
          "deleted_bytes": {
            "type": "integer",
            "minimum": 0
          },
          "oldest_start": {
            "anyOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ]
          },
          "newest_end": {
            "anyOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "segments",
          "ready",
          "anomalous",
          "protected",
          "deleted",
          "duration_ms",
          "logical_bytes",
          "deleted_bytes",
          "oldest_start",
          "newest_end"
        ],
        "additionalProperties": false
      },
      "RecordingDeleteOutcome": {
        "type": "object",
        "description": "Per-record result of a delete request. state is deleted when the local file was removed, otherwise it names why the recording was kept.",
        "properties": {
          "segment_id": {
            "$ref": "m1a.openapi.yaml#/components/schemas/UUID"
          },
          "state": {
            "type": "string",
            "enum": [
              "deleted",
              "protected",
              "not_ready",
              "missing",
              "in_use",
              "not_found"
            ]
          },
          "reason": {
            "type": "string"
          },
          "bytes": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "segment_id",
          "state"
        ],
        "additionalProperties": false
      },
      "RecordingDeleteResult": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RecordingDeleteOutcome"
            }
          },
          "released_bytes": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "items",
          "released_bytes"
        ],
        "additionalProperties": false
      },
      "RecordingPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RecordingSegment"
            }
          },
          "next_cursor": {
            "anyOf": [
              {
                "$ref": "m1a.openapi.yaml#/components/schemas/UUID"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "items",
          "next_cursor"
        ],
        "additionalProperties": false
      },
      "SourceConfigInput": {
        "type": "object",
        "properties": {
          "ip": {
            "type": "string"
          },
          "rtsp_port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535,
            "default": 554
          },
          "main_path": {
            "type": "string",
            "pattern": "^/(?!/)"
          },
          "sub_path": {
            "type": "string"
          },
          "transport": {
            "type": "string",
            "enum": [
              "tcp",
              "udp"
            ]
          },
          "onvif_port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535
          }
        },
        "required": [
          "ip",
          "main_path"
        ],
        "additionalProperties": false
      },
      "LiveOffer": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "stream",
          "sdp"
        ],
        "properties": {
          "stream": {
            "type": "string",
            "enum": [
              "main",
              "sub"
            ]
          },
          "sdp": {
            "type": "string",
            "maxLength": 65536
          }
        }
      },
      "LiveAnswer": {
        "type": "object",
        "required": [
          "id",
          "sdp",
          "stream",
          "fallback",
          "expires_in"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "sdp": {
            "type": "string"
          },
          "stream": {
            "type": "string",
            "enum": [
              "main",
              "sub"
            ]
          },
          "fallback": {
            "type": "boolean"
          },
          "expires_in": {
            "type": "integer",
            "const": 30
          }
        }
      },
      "OnvifProbeInput": {
        "type": "object",
        "properties": {
          "ip": {
            "type": "string"
          },
          "onvif_port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535
          },
          "username": {
            "type": "string",
            "maxLength": 1024
          },
          "password": {
            "type": "string",
            "maxLength": 1024
          }
        },
        "required": [
          "ip"
        ],
        "additionalProperties": false
      },
      "OnvifDevice": {
        "type": "object",
        "properties": {
          "manufacturer": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "firmware_version": {
            "type": "string"
          },
          "serial_number": {
            "type": "string"
          }
        },
        "required": [
          "manufacturer",
          "model",
          "firmware_version",
          "serial_number"
        ],
        "additionalProperties": false
      },
      "OnvifStream": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "encoding": {
            "type": "string"
          },
          "width": {
            "type": "integer"
          },
          "height": {
            "type": "integer"
          },
          "ip": {
            "type": "string"
          },
          "rtsp_port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535
          },
          "path": {
            "type": "string",
            "pattern": "^/(?!/)"
          }
        },
        "required": [
          "token",
          "name",
          "encoding",
          "width",
          "height",
          "ip",
          "rtsp_port",
          "path"
        ],
        "additionalProperties": false
      },
      "OnvifProbe": {
        "type": "object",
        "properties": {
          "device": {
            "$ref": "#/components/schemas/OnvifDevice"
          },
          "streams": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OnvifStream"
            }
          },
          "ptz": {
            "type": "boolean",
            "description": "Capability the device reported. PTZ control is not implemented; this is reported, never offered as a button."
          },
          "onvif_port": {
            "type": "integer",
            "minimum": 1,
            "maximum": 65535
          }
        },
        "required": [
          "device",
          "streams",
          "ptz",
          "onvif_port"
        ],
        "additionalProperties": false
      }
    },
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "one_nvr_session",
        "description": "HTTP deployment cookie. HTTPS deployments use __Host-one_nvr_session instead; browsers send HttpOnly cookies automatically with same-origin credentials."
      }
    }
  }
}
