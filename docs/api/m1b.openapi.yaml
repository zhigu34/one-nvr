            "content": {
              "application/json": {
                "schema": {
                  "$ref": "m1a.openapi.yaml#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Version/state/idempotency conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "m1a.openapi.yaml#/components/schemas/Error"
                }
              }
            }
