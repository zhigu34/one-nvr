          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "data": {
                      "type": "object",
                      "properties": {
                        "initialized": {
                          "type": "boolean"
                        },
                        "csrf_token": {
                          "type": "string"
                        }
                      },
                      "required": [
                        "initialized",
                        "csrf_token"
                      ],
                      "additionalProperties": false
                    },
                    "request_id": {
                      "$ref": "#/components/schemas/UUID"
                    }
                  },
                  "required": [
                    "data",
                    "request_id"
                  ],
                  "additionalProperties": false
                }
              }
            }
          },
          "default": {
            "description": "Structured error (401/403/404/409/422/501/503)",
