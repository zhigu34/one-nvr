  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "one_nvr_session",
        "description": "HTTP deployment cookie. HTTPS deployments use __Host-one_nvr_session instead; browsers send HttpOnly cookies automatically with same-origin credentials."
      }
    },
    "schemas": {
      "UUID": {
        "type": "string",
        "format": "uuid"
      },
      "Version": {
        "type": "integer",
        "format": "int64",
        "minimum": 1
      },
      "HostResources": {
        "type": "object",
        "description": "Host figures for DASH-02. Each metric carries its own Known flag: unknown must be rendered as unknown, never as zero.",
        "properties": {
          "cpu_percent": {
            "type": "number",
            "description": "Busy share of all cores since the previous sample."
          },
          "cpu_known": {
            "type": "boolean",
            "description": "False on the first sample, when there is no interval to divide the /proc/stat counters by."
          },
          "cpu_cores": {
            "type": "integer"
          },
          "memory_percent": {
            "type": "number",
            "description": "Used share of total memory, where used excludes reclaimable cache (MemTotal - MemAvailable)."
          },
          "memory_known": {
            "type": "boolean"
          },
          "memory_total_bytes": {
            "type": "integer",
            "format": "int64"
          },
          "memory_used_bytes": {
            "type": "integer",
            "format": "int64"
          },
          "load_average": {
            "type": "number",
            "description": "One-minute load average. Reported separately from CPU percent: a host can be at 100% of one core with a load of 1.0."
          },
          "load_known": {
            "type": "boolean"
          },
          "event_cache": {
            "type": "object",
            "description": "The in-memory ring buffer used for event pre-recording (PRD REC-09). Capacity is a deployment decision because a mount cannot be resized under a running container.",
            "properties": {
              "configured": {
                "type": "boolean",
                "description": "False when this deployment reserved no memory for the buffer; the feature is off rather than empty."
              },
              "known": {
                "type": "boolean",
                "description": "False when the mount exists but could not be measured."
              },
              "path": {
                "type": "string"
              },
              "total_bytes": {
                "type": "integer",
                "format": "int64"
              },
              "used_bytes": {
                "type": "integer",
                "format": "int64"
              },
              "percent": {
                "type": "number"
              }
            },
            "required": ["configured", "known", "path", "total_bytes", "used_bytes", "percent"],
            "additionalProperties": false
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "cpu_percent",
          "cpu_known",
          "cpu_cores",
          "memory_percent",
          "memory_known",
          "memory_total_bytes",
          "memory_used_bytes",
          "load_average",
          "load_known",
          "event_cache",
          "observed_at"
        ],
        "additionalProperties": false
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "fields": {
                "type": "object",
                "additionalProperties": {
                  "type": "string"
                }
              },
              "retryable": {
                "type": "boolean"
              }
            },
            "required": [
              "code",
              "message",
              "retryable"
            ],
            "additionalProperties": false
          },
          "request_id": {
            "$ref": "#/components/schemas/UUID"
          }
        },
        "required": [
          "error",
          "request_id"
        ],
        "additionalProperties": false
      },
      "User": {
        "type": "object",
        "properties": {
          "id": {
            "$ref": "#/components/schemas/UUID"
          },
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "operator",
              "viewer"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "version": {
            "$ref": "#/components/schemas/Version"
          }
        },
        "required": [
          "id",
          "username",
          "role",
          "enabled",
          "version"
        ],
        "additionalProperties": false
      },
      "Site": {
        "type": "object",
        "properties": {
          "id": {
            "$ref": "#/components/schemas/UUID"
          },
          "name": {
            "type": "string"
          },
          "timezone": {
            "type": "string"
          },
          "channel_count": {
            "type": "integer",
            "enum": [
              16,
              32
            ]
          },
          "require_storage_write_proof": {
            "type": "boolean",
            "description": "Admission-time storage write proof. True (default) requires a verified MP4 write before a pool may start continuous recording. False accepts the pool immediately and relies on the runtime capacity gate and the watchdog that stops a recorder which produces no segment for three minutes; neither of those is optional."
          },
          "recording_retention_days": {
            "type": "integer",
            "minimum": 0,
            "maximum": 3650,
            "description": "Local retention period in days. 0 (default) disables automatic deletion entirely, so an upgraded site keeps every recording until an administrator sets a period. Retention never removes protected recordings."
          },
          "event_clip_lead_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 60,
            "description": "How many seconds of footage before the first detection an event recording starts. Site-wide because the question is the operator's tolerance, not one camera's."
          },
          "event_clip_trail_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 120,
            "description": "How many seconds after the last detection an event recording keeps running. A new event arriving inside this window extends the same recording instead of starting another."
          },
          "version": {
            "$ref": "#/components/schemas/Version"
          }
        },
        "required": [
          "id",
          "name",
          "timezone",
          "channel_count",
          "require_storage_write_proof",
          "recording_retention_days",
          "event_clip_lead_seconds",
          "event_clip_trail_seconds",
          "version"
        ],
        "additionalProperties": false
      },
      "Channel": {
        "type": "object",
        "properties": {
          "id": {
            "$ref": "#/components/schemas/UUID"
          },
          "channel_no": {
            "type": "integer",
            "minimum": 1,
            "maximum": 32
          },
