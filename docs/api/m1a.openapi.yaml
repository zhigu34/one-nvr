{
  "openapi": "3.1.0",
  "info": {
    "title": "one-nvr M1-A API contract",
    "version": "0.1.0",
    "description": "M1-A foundation contract. Obtain signed pre-auth CSRF Cookie/token via setup/status before setup/login. Other mutations use session CSRF from login/me. Cookies are HttpOnly; HTTP names are one_nvr_session/one_nvr_preauth, HTTPS names are __Host-one_nvr_session/__Host-one_nvr_preauth with Secure, Path=/ and no Domain. The configured PUBLIC_URL determines protocol; protocol changes revoke sessions. Credentials/private material never enter read DTOs."
  },
