              "schema": {
                "type": "object",
                "properties": {
                  "channel_name": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128
                  },
                  "channel_group": {
                    "type": "string",
                    "maxLength": 64,
                    "description": "Business grouping; empty clears it. Never rebuilds the media stream."
                  },
                  "enabled": {
                    "type": "boolean",
                    "description": "Enable or disable the channel. Independent of clearing the source and of disabling recording."
                  },
                  "recording_quota_bytes": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 1125899906842624,
                    "description": "Per-channel recording quota in bytes; 0 clears it."
                  },
                  "brand": {
                    "type": "string",
                    "maxLength": 64,
                    "description": "Camera brand. Stored on the channel, not on a source revision: editing it must not re-test or rebuild the stream."
                  },
                  "model": {
                    "type": "string",
                    "maxLength": 128,
                    "description": "Camera model. Empty clears it."
                  },
                  "camera_type": {
                    "type": "string",
                    "maxLength": 32,
                    "description": "Camera form factor (bullet/dome/ptz/...). Empty clears it."
                  }
                },
                "minProperties": 1,
                "additionalProperties": false
              }
            }
          }
        }
      }
    },
