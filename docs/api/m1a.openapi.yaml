      "Capability": {
        "type": "object",
        "description": "One optional module as this build and this deployment actually stand. enabled is the operator's switch, implemented is the release's scope, state is what the deployment can do right now, reason says why. A module whose dependency is down reads unavailable (not implemented): 功能未启用 / 引导配置 / 运行异常 / 版本尚未提供.",
        "properties": {
          "enabled": {
            "type": "boolean",
            "description": "The deployment switch. Off means the module is not running here, whatever the build contains."
          },
          "implemented": {
            "type": "boolean",
            "description": "Whether this build carries the module's business logic. A release property, never a health signal."
          },
          "state": {
            "type": "string",
            "enum": [
              "disabled",
              "not_configured",
              "healthy",
              "unavailable",
              "not_available",
              "unverified"
            ],
            "description": "disabled: switch off. not_configured: switched on with nothing set up yet. healthy: configured and its dependencies answered. unavailable: configured but a dependency did not answer. not_available: this build does not carry it. unverified: configured but never tested — not the same as unavailable, because nothing has measured it."
          },
          "reason": {
            "type": "string"
          }
        },
        "required": [
          "enabled",
          "implemented",
          "state",
          "reason"
        ],
        "additionalProperties": false
      },
